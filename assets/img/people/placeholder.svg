<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1f5"/>
      <stop offset="1" stop-color="#e2dfe8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- antenna -->
  <line x1="200" y1="70" x2="200" y2="110" stroke="#8d8798" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="62" r="16" fill="#b3001b"/>
  <!-- head -->
  <rect x="95" y="110" width="210" height="160" rx="36" fill="#ffffff" stroke="#8d8798" stroke-width="10"/>
  <!-- eyes -->
  <circle cx="160" cy="185" r="22" fill="#2d2a33"/>
  <circle cx="240" cy="185" r="22" fill="#2d2a33"/>
  <circle cx="167" cy="178" r="7" fill="#ffffff"/>
  <circle cx="247" cy="178" r="7" fill="#ffffff"/>
  <!-- smile -->
  <path d="M160 232 Q200 262 240 232" fill="none" stroke="#2d2a33" stroke-width="10" stroke-linecap="round"/>
  <!-- ears -->
  <rect x="70" y="165" width="25" height="50" rx="10" fill="#8d8798"/>
  <rect x="305" y="165" width="25" height="50" rx="10" fill="#8d8798"/>
  <!-- body -->
  <rect x="130" y="290" width="140" height="110" rx="30" fill="#ffffff" stroke="#8d8798" stroke-width="10"/>
  <circle cx="200" cy="335" r="14" fill="#b3001b"/>
</svg>
