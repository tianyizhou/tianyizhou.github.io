name: Refresh Google Scholar totals

on:
  schedule:
    - cron: "41 2 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update citations, h-index and i10-index in the CV
        run: python3 scripts/update_scholar.py
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/cv.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Google Scholar totals"
            git push
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
