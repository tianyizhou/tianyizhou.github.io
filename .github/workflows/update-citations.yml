name: Refresh citation counts

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update citations in papers.bib
        run: python3 scripts/update_citations.py
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh citation counts"
            git push
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
